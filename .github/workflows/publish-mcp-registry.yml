name: Publish to MCP Registry

# Publishes server.json to the official MCP registry (registry.modelcontextprotocol.io)
# using GitHub Actions OIDC. CI running inside this repo authenticates as the
# awesomemotive org and gets the io.github.awesomemotive/* namespace — no personal
# GitHub login or public org membership required.
#
# Like ci.yml, this only takes effect in the public repo
# (https://github.com/awesomemotive/pushengage-mcp), where this package is the repo root.
#
# Run it AFTER the same version is live on npm: the registry verifies the npm package
# exists and that its package.json mcpName matches server.json's name.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  id-token: write # lets mcp-publisher mint the OIDC token it exchanges for registry auth
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Verify package.json and server.json versions match
        run: |
          node -e "
            const pkg = require('./package.json');
            const server = require('./server.json');
            const versions = [pkg.version, server.version, server.packages[0].version];
            if (new Set(versions).size !== 1) {
              console.error('Version mismatch: package.json=' + versions[0] +
                ', server.json version=' + versions[1] +
                ', server.json packages[0].version=' + versions[2]);
              process.exit(1);
            }
            console.log('Versions in sync: ' + pkg.version);
          "

      - name: Verify this version is live on npm
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if ! npm view "${NAME}@${VERSION}" version; then
            echo "::error::${NAME}@${VERSION} is not on npm — publish to npm first (npm run publish:guided)."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          ARCH=$(uname -m); case "$ARCH" in x86_64) ARCH=amd64 ;; aarch64) ARCH=arm64 ;; esac
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_${ARCH}.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Log in to the MCP registry via GitHub OIDC
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        run: mcp-publisher publish
