name: CI

# This directory only takes effect in the public repo
# (https://github.com/awesomemotive/pushengage-mcp), where this package is the
# repo root. In the internal monorepo it sits in a subdirectory, which GitHub
# Actions ignores.

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify publishable tarball contents
        run: |
          npm pack --dry-run --json > pack.json
          node -e "
            const files = require('./pack.json')[0].files.map(f => f.path);
            const bad = files.filter(f =>
              !/^dist\//.test(f) && !['README.md', 'CHANGELOG.md', 'LICENSE', 'package.json'].includes(f)
            );
            if (bad.length) {
              console.error('Unexpected files in tarball:', bad);
              process.exit(1);
            }
            console.log(files.length + ' files, all expected.');
          "
